name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "2"
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: install (CPU wheels)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu \
              --extra-index-url https://pypi.org/simple -r requirements.txt
      - name: AP metric, 15 hand-computed cases
        run: python test_ap.py
      - name: target encoding is invertible
        run: python test_detector.py
      - name: INT8 round trip, pruning rewiring, MAC count
        run: python test_edge.py
      - name: real-photo crop, orientation, EXIF stripped
        run: python test_prep_real.py
      - name: real-photo eval (HOPE) crop, class map, ignore
        run: python test_real_hope.py
      - name: frozen-backbone detector (no download)
        run: python test_backbone.py
      - name: README headline table vs runs/*.json
        run: python test_readme.py
      - name: tracked detector.onnx is still the tracked det_hard_none.pt
        run: python test_onnx_parity.py
      - name: texl label textures (no rendering)
        run: python test_textures.py

  cpp-ort:
    # C++ detector (cpp/detect_ort.cpp) against ONNX Runtime 1.30.0 must match Python ORT +
    # detector.decode bit for bit (cpp/ci.sh). Python 3.12: onnxruntime 1.30.0 has no 3.10 wheel.
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple torch onnxruntime==1.30.0 onnx opencv-python-headless numpy
      - run: cpp/ci.sh
